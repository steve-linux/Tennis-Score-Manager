# Compila l'app ed esegue i test a ogni push e pull request (stesso comando del README).
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TennisScoreManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # testDebugUnitTest copre solo l'app: le regole dei campi e il server del circolo hanno i loro test (test).
      # lintDebug ferma la build sugli errori di lint (i warning restano nel report).
      - run: ./gradlew testDebugUnitTest :courtcore:test :server:test lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: TennisScoreManager/app/build/reports
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: TennisScoreManager/app/build/outputs/apk/debug/*.apk
          retention-days: 7
