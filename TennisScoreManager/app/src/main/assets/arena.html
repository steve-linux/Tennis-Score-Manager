    {"t":"cfg", lang, level, games, strict, voice, lagMs, two, p1:{name,band}, p2:{name,band}}
    {"t":"swing", side, s (forza 0..1), gyro, after}   inizio di un colpo (firmware 2.5, SWING)

    {"t":"key", side, k (1 tasto grande, 2 tasto piccolo)}
    {"t":"closed"}
  Senza internet: niente librerie esterne. Anteprima senza telefono: arena.html?demo=1 (SPAZIO = swing, V = visuale; &gfx=0/1/2, &two=1).

const rnd = (a, b) => a + Math.random() * (b - a);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const DEMO = /[?&]demo=1/.test(location.search);

/* ----------------------------- Testi (6 lingue, come l'app) -------------------------------- */

    paused: 'PAUSE', pauseHint: 'Petite touche du bracelet pour reprendre', firstTo: n => 'premier à ' + n + (n === 1 ? ' jeu' : ' jeux'), levels: ['Facile', 'Moyen', 'Difficile'], keys: 'Sans bracelet : ESPACE = swing',

  de: { wait: 'Öffne TSM Arena am Handy', waitSub: 'Tennis Score Manager › Trainieren › TSM Arena', link: 'Verbindung zum Handy…', lost: 'Handy nicht erreichbar: neuer Versuch…', closed: 'TSM Arena wurde am Handy geschlossen',
    start: 'Schwingen oder große Armbandtaste zum Starten', audio: 'Drücke OK auf der Fernbedienung für den Ton', bandOn: 'Armband verbunden', bandOff: 'Armband nicht verbunden', cpu: 'Handy',
    serve: 'Schwung zum Aufschlag', second: 'Zweiter Aufschlag', fault: 'FEHLER', dfault: 'DOPPELFEHLER', out: 'AUS!', net: 'NETZ!', ace: 'ASS!', winner: 'WINNER!', wrong: 'FALSCHER SCHLAG', wasFore: 'das war eine Vorhand', wasBack: 'das war eine Rückhand',
    perfect: 'PERFEKT!', early: 'ZU FRÜH', late: 'ZU SPÄT', bomb: 'BOMBE!', deuce: 'EINSTAND', adv: 'VORTEIL', game: 'Spiel', wins: 'gewinnt!', rematch: 'Schwingen oder große Taste für die Revanche', go: 'LOS!',
    paused: 'PAUSE', pauseHint: 'Kleine Armbandtaste zum Fortsetzen', firstTo: n => 'wer zuerst ' + n + (n === 1 ? ' Spiel' : ' Spiele') + ' hat', levels: ['Leicht', 'Mittel', 'Schwer'], keys: 'Ohne Armband: LEERTASTE = Schwung',
    stats: ['Schläge', 'Perfekt', 'Zu früh', 'Zu spät', 'Falscher Schlag', 'Höchsttempo (°/s)'], rally: 'Längster Ballwechsel',
    say: { pts: ['null', 'fünfzehn', 'dreißig', 'vierzig'], all: 'beide', deuce: 'Einstand', adv: 'Vorteil', game: 'Spiel', match: 'Spiel, Satz und Sieg', fault: 'Fehler', dfault: 'Doppelfehler', voice: 'de-DE' } },
  es: { wait: 'Abre TSM Arena en el teléfono', waitSub: 'Tennis Score Manager › Entrenar › TSM Arena', link: 'Conectando con el teléfono…', lost: 'Teléfono no disponible: reintentando…', closed: 'TSM Arena se cerró en el teléfono',
    start: 'Swing o tecla grande de la pulsera para empezar', audio: 'Pulsa OK en el mando para activar el sonido', bandOn: 'pulsera conectada', bandOff: 'pulsera no conectada', cpu: 'Teléfono',
    serve: 'swing para sacar', second: 'Segundo saque', fault: 'FALTA', dfault: 'DOBLE FALTA', out: '¡FUERA!', net: '¡RED!', ace: '¡ACE!', winner: '¡GANADOR!', wrong: 'GOLPE EQUIVOCADO', wasFore: 'era una derecha', wasBack: 'era un revés',
    perfect: '¡PERFECTO!', early: 'ANTICIPADO', late: 'TARDE', bomb: '¡BOMBAZO!', deuce: 'IGUALES', adv: 'VENTAJA', game: 'Juego', wins: '¡gana!', rematch: 'Swing o tecla grande para la revancha', go: '¡A JUGAR!',
    paused: 'PAUSA', pauseHint: 'Tecla pequeña de la pulsera para seguir', firstTo: n => 'el primero en ' + n + (n === 1 ? ' juego' : ' juegos'), levels: ['Fácil', 'Medio', 'Difícil'], keys: 'Sin pulsera: ESPACIO = swing',
    stats: ['Golpes', 'Perfectos', 'Anticipados', 'Tarde', 'Golpe equivocado', 'Velocidad máx. (°/s)'], rally: 'Peloteo más largo',
    say: { pts: ['nada', 'quince', 'treinta', 'cuarenta'], all: 'iguales', deuce: 'iguales', adv: 'ventaja', game: 'juego', match: 'juego, set y partido', fault: 'falta', dfault: 'doble falta', voice: 'es-ES' } },
  pt: { wait: 'Abra o TSM Arena no celular', waitSub: 'Tennis Score Manager › Treinar › TSM Arena', link: 'Conectando ao celular…', lost: 'Celular não encontrado: tentando de novo…', closed: 'O TSM Arena foi fechado no celular',
    start: 'Swing ou tecla grande da pulseira para começar', audio: 'Aperte OK no controle remoto para ligar o som', bandOn: 'pulseira conectada', bandOff: 'pulseira não conectada', cpu: 'Celular',
    serve: 'swing para sacar', second: 'Segundo saque', fault: 'FALTA', dfault: 'DUPLA FALTA', out: 'FORA!', net: 'REDE!', ace: 'ACE!', winner: 'WINNER!', wrong: 'GOLPE ERRADO', wasFore: 'era um forehand', wasBack: 'era um backhand',
    perfect: 'PERFEITO!', early: 'ADIANTADO', late: 'ATRASADO', bomb: 'BOMBA!', deuce: 'IGUAIS', adv: 'VANTAGEM', game: 'Game', wins: 'vence!', rematch: 'Swing ou tecla grande para a revanche', go: 'VALENDO!',
    paused: 'PAUSA', pauseHint: 'Tecla pequena da pulseira para continuar', firstTo: n => 'quem fizer ' + n + (n === 1 ? ' game' : ' games') + ' primeiro', levels: ['Fácil', 'Médio', 'Difícil'], keys: 'Sem pulseira: ESPAÇO = swing',
    stats: ['Golpes', 'Perfeitos', 'Adiantados', 'Atrasados', 'Golpe errado', 'Velocidade máx. (°/s)'], rally: 'Troca mais longa',
    say: { pts: ['zero', 'quinze', 'trinta', 'quarenta'], all: 'iguais', deuce: 'iguais', adv: 'vantagem', game: 'game', match: 'game, set e partida', fault: 'falta', dfault: 'dupla falta', voice: 'pt-BR' } },
};
let T = TX.it;

/* ----------------------------- Impostazioni dal telefono -------------------------------- */
const CFG = { level: 2, games: 3, strict: true, voice: true, lagMs: 70, two: false, gfx: 2, p1: { name: 'Rossi', band: false }, p2: { name: '', band: false } };
let link = DEMO ? 'demo' : 'connecting';   // connecting | ok | lost | closed | demo
let gotCfg = DEMO;

/* ----------------------------- Motore -------------------------------- */
const G = 9.81, R = 0.035, HL = 11.885, HW = 4.115, DW = 5.485, SVC = 6.40, DT = 1 / 120;
// Il braccialetto manda SWING ~30 ms dopo la soglia, ~60 ms prima del picco del colpo (cioè dell'impatto): arriva
// alla pagina ~40 ms prima dell'impatto vero. La TV mostra l'immagine in ritardo di lagMs: il colpo arriva più tardi.
const idealTc = () => 0.04 - CFG.lagMs / 1000;
const WIN_BEFORE = 0.19, WIN_AFTER = 0.27;
const LEVELS = {
  1: { spd: 13, noise: 0.9, move: 4.4, react: 0.32, aim: 0.3, srv: 17, err: 0.15 },
  2: { spd: 16.5, noise: 0.7, move: 5.5, react: 0.22, aim: 0.55, srv: 21, err: 0.09 },
  3: { spd: 20, noise: 0.5, move: 6.6, react: 0.14, aim: 0.8, srv: 26, err: 0.05 },
};
const L = () => LEVELS[CFG.level] || LEVELS[2];
const human = i => i === 0 || CFG.two;
const nameOf = i => i === 0 ? (CFG.p1.name || 'P1') : (CFG.two ? (CFG.p2.name || 'P2') : T.cpu);

const S = {
  phase: 'title', timer: 0, shotT: 0, contact: null, server: 0, pts: [0, 0], games: [0, 0], faults: 0, winner: -1, paused: false,
  msg: '', sub: '', msgT: 0, fb: '', fbT: 0, fbWho: 0, tossBy: -1, tossS: 0.6,
  ball: { x: 0, y: -1, z: 0, vx: 0, vy: 0, vz: 0, bounces: 0, lastHitter: 0, serve: false, netted: false, show: false },
  trail: [], rally: 0, lastHit: null,
  st: null,
};
const P = [
  { x: 0, z: -HL - 0.8, tx: 0, tz: -HL - 0.8, swing: -1, fore: true, react: 0, serveAnim: false, shirt: '#ffd600', shorts: '#f4f4f4', hair: '#3b2a1e' },
  { x: 0, z: HL + 0.8, tx: 0, tz: HL + 0.8, swing: -1, fore: true, react: 0, serveAnim: false, shirt: '#e53935', shorts: '#1c2b4a', hair: '#151515' },
];
const newStats = () => [0, 1].map(() => ({ hits: 0, perfect: 0, early: 0, late: 0, wrong: 0, maxGyro: 0 }));
S.st = newStats();
const sideZ = i => (i === 0 ? -1 : 1);
const homeZ = i => sideZ(i) * (HL + 0.8);
const netH = x => 0.914 + 0.156 * Math.min(1, Math.abs(x) / (DW + 0.914));
const serverXSign = (who, deuce) => (who === 0 ? 1 : -1) * (deuce ? 1 : -1);
const isDeuceCourt = () => (S.pts[0] + S.pts[1]) % 2 === 0;

function stepBall(b, dt) {
  const pz = b.z;
  b.vy -= G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  let ev = null;
  if (!b.netted && pz * b.z <= 0 && pz !== b.z && b.y < netH(b.x) + R && Math.abs(b.x) < DW + 0.914) {
    b.netted = true; b.z = pz > 0 ? 0.06 : -0.06; b.vz *= -0.15; b.vx *= 0.3; ev = 'net';
  }
  if (b.y < R && b.vy < 0) {
    b.y = R; b.vy = -b.vy * 0.7; b.vx *= 0.86; b.vz *= 0.86;
    if (b.vy < 0.5) b.vy = 0;
    if (!ev && b.vy > 0) ev = 'bounce';
  }
  return ev;
}

function solveShot(b, tx, tz, speed, clear) {
  const dx = tx - b.x, dz = tz - b.z, d = Math.hypot(dx, dz) || 1;
  let vh = speed, out = null;
  for (let i = 0; i < 60; i++) {
    const T_ = d / vh, vy = (R - b.y + 0.5 * G * T_ * T_) / T_;
    out = { vx: dx / T_, vy, vz: dz / T_ };
    const tn = -b.z / (dz / T_);
    if (tn > 0 && tn < T_) {
      const yn = b.y + vy * tn - 0.5 * G * tn * tn;
      if (yn < netH(b.x + dx * tn / T_) + clear) { vh *= 0.96; continue; }
    }
    break;
  }
  return out;
}

function predictContact(b, who) {
  const s = { ...b }; let t = 0, n = 0;
  const sz = sideZ(who);
  for (let i = 0; i < 1000; i++) {
    const ev = stepBall(s, DT); t += DT;
    if (ev === 'net') return null;
    if (ev === 'bounce') { n++; if (n >= 2) return { x: s.x, y: s.y, z: s.z, t }; }
    if (n === 1 && s.z * sz > 0) {
      if ((s.vy <= 0 && s.y < 1.05) || Math.abs(s.z) > HL + 3) return { x: s.x, y: s.y, z: s.z, t };
    }
  }
  return null;
}

function setupReceive(r) {
  const c = predictContact(S.ball, r);
  S.contact = c ? { ...c, who: r, done: false } : null;
  const p = P[r];
  if (c) {
    const right = r === 0 ? 1 : -1;
    p.fore = (c.x - p.x) * right > -0.6;
    // In prima persona la palla passa più vicina: resta nell'inquadratura fino all'impatto.
    const off = (r === 0 && VIEW === 'fp' ? 0.5 : 0.75) * (p.fore ? 1 : -1) * right;
    p.tx = clamp(c.x - off, -9, 9);
    p.tz = c.z + sideZ(r) * 0.35;
    p.tz = r === 0 ? clamp(p.tz, -HL - 3.4, -1.5) : clamp(p.tz, 1.5, HL + 3.4);
    p.react = human(r) ? 0 : L().react;
  }
}

function launch(who, v, isServe) {
  const b = S.ball;
  Object.assign(b, v);
  b.bounces = 0; b.lastHitter = who; b.netted = false; b.show = true; b.serve = isServe;
  S.shotT = 0; S.phase = 'rally';
  if (!isServe) S.rally++;
  setupReceive(1 - who);
  const h = P[who];
  h.tx = clamp(h.x * 0.25, -1, 1); h.tz = homeZ(who); h.react = 0.15;
  sfx('hit', Math.hypot(v.vx, v.vz) / 30);
  if (human(who)) {
    const sp = Math.hypot(v.vx, v.vy, v.vz);
    FX.speed = Math.round(sp * 3.6); FX.speedT = 2.2;
    spawnHit(b.x, b.y, b.z, clamp((sp - 13) / 20, 0, 1));
  }
}

function hitBall(who, tx, tz, speed) { launch(who, solveShot(S.ball, tx, tz, speed, 0.25), false); }

/** Colpo di un giocatore col braccialetto: [o] > 0 in anticipo (palla incrociata), < 0 in ritardo (lungolinea). */
function humanHit(i, s, tc, gyro) {
  const p = P[i];
  const o = clamp((tc - idealTc()) / 0.2, -1.25, 1.25);
  const dir = (p.fore ? -1 : 1) * (i === 0 ? 1 : -1);
  const tx = dir * o * 3.6 + gauss() * 0.35;
  const tz = -sideZ(i) * (6.3 + s * 4.3 + gauss() * 0.35);
  hitBall(i, tx, tz, 13 + s * 17);
  const st = S.st[i];
  st.hits++; st.maxGyro = Math.max(st.maxGyro, gyro || 0);
  if (Math.abs(o) < 0.3) { st.perfect++; S.fb = T.perfect; } else if (o > 0) { st.early++; S.fb = T.early; } else { st.late++; S.fb = T.late; }
  if (s > 0.85 && Math.abs(o) < 0.5) S.fb = T.bomb;
  S.fbT = 1.1; S.fbWho = i;
  S.lastHit = { who: i, fore: p.fore, at: performance.now(), checked: false };
}

function cpuHit() {
  const lv = L(), h = P[0], b = S.ball;
  let tx = Math.random() < lv.aim ? (h.x > 0 ? -1 : 1) * rnd(1.8, 3.7) : rnd(-3.2, 3.2);
  let tz = -rnd(6.3, 10.6);
  tx += gauss() * lv.noise * 0.6; tz += gauss() * lv.noise * 0.7;
  if (Math.random() < lv.err) { if (Math.random() < 0.5) tx = (tx >= 0 ? 1 : -1) * rnd(4.4, 5.3); else tz = -rnd(12.2, 13.6); }
  hitBall(1, tx, tz, lv.spd + rnd(-2, 4));
}

function toss(who, s, gyro) {
  const p = P[who], b = S.ball;
  // la palla si lancia con la mano sinistra, un po' davanti
  Object.assign(b, { x: p.x + (who === 0 ? -0.3 : 0.3), y: 1.3, z: p.z - sideZ(who) * 0.35, vx: 0, vy: 5.2, vz: 0, bounces: 0, netted: false, show: true });
  S.phase = 'toss'; S.timer = 0; S.tossBy = who; S.tossS = s;
  p.serveAnim = true; p.swing = -1;
  if (human(who)) { const st = S.st[who]; st.maxGyro = Math.max(st.maxGyro, gyro || 0); }
}

function serveHit() {
  const who = S.tossBy, s = S.tossS, b = S.ball;
  const sz = -sideZ(who);
  const boxSign = -serverXSign(who, isDeuceCourt());
  const second = S.faults === 1;
  let risk, speed;
  if (human(who)) {
    risk = second ? 0.04 + 0.12 * Math.max(0, s - 0.6) : 0.07 + 0.42 * Math.max(0, s - 0.55);
    speed = second ? 17 + s * 7 : 20 + s * 20;
  } else {
    risk = second ? 0.05 : 0.15;
    speed = second ? 16 : L().srv + rnd(0, 5);
  }
  let tx = boxSign * rnd(0.6, 3.6), tz = sz * rnd(3.8, 6.0);
  if (Math.random() < risk) { if (Math.random() < 0.6) tz = sz * rnd(6.7, 7.9); else tx = boxSign * rnd(4.35, 5.1); }
  S.rally = 0;
  launch(who, solveShot(b, tx, tz, speed, 0.16), true);
}

function inServiceBox(b) {
  const who = b.lastHitter, sz = -sideZ(who);
  const boxSign = -serverXSign(who, isDeuceCourt());
  return b.z * sz > 0 && Math.abs(b.z) <= SVC + R && b.x * boxSign >= -R && Math.abs(b.x) <= HW + R;
}

function showMsg(m, sub, t = 1.8) { S.msg = m; S.sub = sub || ''; S.msgT = t; }

function pointText(i) {
  const a = S.pts[i], b = S.pts[1 - i];
  if (a >= 3 && b >= 3) return a > b ? 'AD' : '40';
  return ['0', '15', '30', '40'][a];
}

/** Punteggio da mostrare (sempre P1 prima) e da dire (chi serve prima, come l'arbitro). */
function pointCall() {
  const a = S.pts[0], c = S.pts[1], n = ['0', '15', '30', '40'];
  if (a >= 3 && c >= 3) return a === c ? T.deuce : T.adv + ' ' + nameOf(a > c ? 0 : 1);
  return n[a] + ' – ' + n[c];
}
function pointSay() {
  const sv = S.server, a = S.pts[sv], c = S.pts[1 - sv], w = T.say.pts;
  if (a >= 3 && c >= 3) return a === c ? T.say.deuce : T.say.adv + ' ' + nameOf(a > c ? sv : 1 - sv);
  return a === c ? w[a] + ' ' + T.say.all : w[a] + ', ' + w[c];
}

function fault(reason) {
  if (S.faults === 0) {
    S.faults = 1; S.phase = 'fault'; S.timer = 0; S.contact = null;
    showMsg(T.fault, T.second, 1.3);
    say(T.say.fault);
  } else pointTo(1 - S.ball.lastHitter, T.dfault, T.say.dfault);
}

function pointTo(w, reason, spoken) {
  S.phase = 'point'; S.timer = 0; S.contact = null; S.faults = 0;
  const l = 1 - w;
  S.pts[w]++;
  S.longest = Math.max(S.longest || 0, S.rally);
  let sub, words;
  if (S.pts[w] >= 4 && S.pts[w] - S.pts[l] >= 2) {
    S.games[w]++; S.pts = [0, 0]; S.server = 1 - S.server;
    sub = T.game + ' ' + nameOf(w) + '  ·  ' + S.games[0] + '–' + S.games[1];
    words = T.say.game + ' ' + nameOf(w);
    if (S.games[w] >= CFG.games) { S.winner = w; words = T.say.match + ', ' + nameOf(w); }
  } else { sub = pointCall(); words = pointSay(); }
  showMsg(reason, sub, 2.0);
  say((spoken ? spoken + '. ' : '') + words);
  sfx(human(w) ? 'cheer' : 'groan');
}

function setupServe() {
  S.phase = 'serve'; S.timer = 0; S.contact = null; S.lastHit = null;
  const srv = S.server, sx = serverXSign(srv, isDeuceCourt()), r = 1 - srv;
  P[srv].tx = sx * 0.9; P[srv].tz = sideZ(srv) * (HL + 0.25);
  P[r].tx = -sx * 2.7; P[r].tz = sideZ(r) * (HL + 0.7);
  P.forEach(p => { p.react = 0; p.swing = -1; p.serveAnim = false; });
  S.ball.show = true; S.trail = [];
}

function startMatch() {
  Object.assign(S, { pts: [0, 0], games: [0, 0], faults: 0, winner: -1, server: 0, paused: false, rally: 0, longest: 0, st: newStats() });
  P[0].x = 0.9; P[0].z = -HL - 0.25; P[1].x = -2.7; P[1].z = HL + 0.7;
  setupServe();
  showMsg(T.go, T.firstTo(CFG.games), 1.6);
  ovRender();
}

/** Inizio di un colpo dal braccialetto [i] (0 = P1, 1 = P2), forza 0..1. */
function onSwing(i, s, gyro) {
  unlockAudio();
  if (!human(i)) return;
  if (S.phase === 'title' || S.phase === 'over') { if (gotCfg && (S.phase === 'title' || S.timer > 1.2)) startMatch(); return; }
  if (S.paused) return;
  const p = P[i];
  if (S.phase === 'serve') { if (S.server === i && S.timer > 0.5) toss(i, s, gyro); return; }
  if (S.phase === 'toss') return;
  if (p.swing >= 0 && p.swing < 0.25) return;
  p.swing = 0; p.serveAnim = false;
  if (S.phase !== 'rally') return;
  const c = S.contact;
  sfx('whoosh');
  if (!c || c.done || c.who !== i) return;
  const tc = c.t - S.shotT, ideal = idealTc();
  const close = Math.hypot(p.x - p.tx, p.z - p.tz) < 1.1;
  if (tc <= ideal + WIN_AFTER && tc >= ideal - WIN_BEFORE && close) { c.done = true; humanHit(i, s, tc, gyro); }
}

/** Colpo riconosciuto dal braccialetto (~0,4 s dopo): con "solo il colpo giusto" un dritto al posto del rovescio è punto perso. */
function onStroke(i, k) {
  const h = S.lastHit;
  if (!h || h.who !== i || h.checked || performance.now() - h.at > 1500) return;
  h.checked = true;
  if (k !== 0 && k !== 1) return;          // servizio, volée o "?": niente da controllare
  const want = h.fore ? 0 : 1;
  if (k === want) return;
  S.st[i].wrong++;
  if (CFG.strict && S.phase === 'rally' && S.ball.lastHitter === i) {
    pointTo(1 - i, T.wrong, null);
    S.sub = (want === 0 ? T.wasFore : T.wasBack) + '  ·  ' + S.sub;
  }
}

function onKey(i, k) {
  unlockAudio();
  if (k === 1) {
    if (S.paused) { S.paused = false; ovRender(); return; }
    if (S.phase === 'title' || S.phase === 'over') onSwing(i, 0.6, 0);
    return;
  }
  if (k === 2 && !['title', 'over'].includes(S.phase)) { S.paused = !S.paused; ovRender(); }
}

function movePlayers(dt) {
  const fast = S.phase === 'serve' || S.phase === 'point' || S.phase === 'fault';
  P.forEach((p, i) => {
    if (p.swing >= 0) { p.swing += dt; if (p.swing > 0.45) p.swing = -1; }
    if (p.react > 0) { p.react -= dt; return; }
    const sp = fast ? 7 : (human(i) ? 7.8 : L().move);
    const dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz);
    if (d > 1e-3) { const st = Math.min(d, sp * dt); p.x += dx / d * st; p.z += dz / d * st; }
  });
}

function update(dt) {
  if (S.paused) return;
  S.timer += dt;
  if (S.msgT > 0) S.msgT -= dt;
  if (S.fbT > 0) S.fbT -= dt;
  movePlayers(dt);
  const b = S.ball;
  switch (S.phase) {
    case 'title': {
      const t = performance.now() / 1000;
      P[0].tx = Math.sin(t * 0.6) * 2; P[1].tx = Math.sin(t * 0.5 + 1) * 2;
      b.show = false;
      break;
    }
    case 'serve': {
      const srv = P[S.server];
      Object.assign(b, { x: srv.x + (S.server === 0 ? -0.3 : 0.3), y: 1.0, z: srv.z - sideZ(S.server) * 0.3, show: true });
      const arrived = P.every(p => Math.hypot(p.x - p.tx, p.z - p.tz) < 0.05);
      if (!human(S.server) && arrived && S.timer > 1.3) toss(S.server, 0.7, 0);
      break;
    }
    case 'toss': {
      b.vy -= G * dt; b.y += b.vy * dt;
      const p = P[S.tossBy];
      if (S.timer > 0.32 && p.swing < 0) p.swing = 0;
      if (S.timer >= 0.5) serveHit();
      break;
    }
    case 'rally': {
      S.shotT += dt;
      const ev = stepBall(b, dt);
      S.trail.push({ x: b.x, y: b.y, z: b.z }); if (S.trail.length > 9) S.trail.shift();
      if (ev === 'net') { sfx('net'); if (b.serve) fault('net'); else pointTo(1 - b.lastHitter, T.net); return; }
      if (ev === 'bounce') {
        b.bounces++;
        sfx('bounce');
        if (b.bounces === 1) {
          const recv = -sideZ(b.lastHitter);
          if (b.serve) { if (!inServiceBox(b)) { fault('out'); return; } }
          else if (!(b.z * recv > 0 && Math.abs(b.x) <= HW + R && Math.abs(b.z) <= HL + R)) { pointTo(1 - b.lastHitter, T.out); return; }
        } else { pointTo(b.lastHitter, b.serve ? T.ace : T.winner); return; }
      }
      const c = S.contact;
      if (c && !c.done && c.who === 1 && !human(1)) {
        const p = P[1];
        if (c.t - S.shotT < 0.2 && p.swing < 0) p.swing = 0;
        if (S.shotT >= c.t) {
          c.done = true;
          if (Math.hypot(p.x - p.tx, p.z - p.tz) < 0.7) cpuHit();
        }
      }
      if (Math.abs(b.z) > HL + 9 || Math.abs(b.x) > 14) pointTo(b.lastHitter, b.serve ? T.ace : T.winner);
      break;
    }
    case 'fault':
    case 'point': {
      stepBall(b, dt);
      if (S.phase === 'fault' && S.timer > 1.4) setupServe();
      else if (S.phase === 'point' && S.timer > 2.1) {
        if (S.winner >= 0) { S.phase = 'over'; S.timer = 0; b.show = false; ovRender(); }
        else setupServe();
      }
      break;
    }
    case 'over': stepBall(b, dt); break;
  }
}

/* ----------------------------- Audio e voce -------------------------------- */
let AC = null, NOISE = null;
function unlockAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function noise(dur, freq, q, gain, t0 = 0, sweepTo) {
  const t = AC.currentTime + t0, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = NOISE; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.05, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(AC.destination); src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function tone(type, f0, f1, dur, gain) {
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(type, p = 1) {
  if (!AC || AC.state !== 'running') return;
  try {
    if (type === 'hit') { tone('triangle', 1100, 180, 0.07, 0.35 + 0.3 * clamp(p, 0, 1)); noise(0.06, 2500, 1.2, 0.35); }
    else if (type === 'bounce') tone('sine', 220, 70, 0.09, 0.35);
    else if (type === 'net') noise(0.25, 300, 0.8, 0.3);
    else if (type === 'whoosh') noise(0.18, 600, 1.5, 0.12, 0, 2400);
    else if (type === 'cheer') { noise(1.6, 1300, 0.6, 0.18); noise(1.4, 700, 0.5, 0.12, 0.1); }
    else if (type === 'groan') noise(1.0, 350, 0.7, 0.14, 0, 200);
  } catch (e) {}
}
function say(text) {
  if (!CFG.voice || !text || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = T.say.voice;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(T.say.voice.slice(0, 2)));
    if (v) u.voice = v;
    u.rate = 1.05;
    setTimeout(() => speechSynthesis.speak(u), 350);   // dopo il suono del punto
  } catch (e) {}
}

/* ----------------------------- Disegno -------------------------------- */
// Due visuali: "fp" = prima persona (occhi del Giocatore 1, racchetta in primo piano), "tv" = da dietro come in TV.
// Da soli si gioca in prima persona; in due la visuale TV (si vedono tutti e due). Tasto V per cambiarla.
let CV, CTX, W = 1280, H = 720, FOC = 1, VIEW = 'fp', viewForced = false;
const CAM = { x: 0, y: 1.75, z: -14, pitch: 0.05 };
const NEAR = 0.12;
const FX = { parts: [], flash: 0, shake: 0, speed: 0, speedT: 0, crowd: null, glow: null, t: 0 };
const fp = () => VIEW === 'fp';
function autoView() { if (!viewForced) VIEW = CFG.two ? 'tv' : 'fp'; }

function toCam(x, y, z) {
  const rx = x - CAM.x, ry = y - CAM.y, rz = z - CAM.z, c = Math.cos(CAM.pitch), s = Math.sin(CAM.pitch);
  return [rx, ry * c + rz * s, rz * c - ry * s];
}
function projC(v) { const f = FOC / v[2]; return { x: W / 2 + v[0] * f, y: H / 2 - v[1] * f, s: f, d: v[2] }; }
/** Punto del mondo sullo schermo; null se è dietro la telecamera. */
function proj(x, y, z) { const v = toCam(x, y, z); return v[2] < NEAR ? null : projC(v); }
function clipNear(v) {
  const out = [];
  for (let i = 0; i < v.length; i++) {
    const a = v[i], b = v[(i + 1) % v.length], ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]); }
  }
  return out;
}
/** Poligono nel mondo ([x,y,z]...), tagliato davanti alla telecamera. */
function polyW(pts, fill) {
  const v = clipNear(pts.map(p => toCam(p[0], p[1], p[2])));
  if (v.length < 3) return false;
  CTX.beginPath();
  v.forEach((c, i) => { const q = projC(c); i ? CTX.lineTo(q.x, q.y) : CTX.moveTo(q.x, q.y); });
  CTX.closePath(); CTX.fillStyle = fill; CTX.fill();
  return true;
}
const ground = (pts, fill) => polyW(pts.map(p => [p[0], 0, p[1]]), fill);
function lineW(x1, z1, x2, z2, w = 0.05) {
  const hw = w / 2;
  if (x1 === x2) ground([[x1 - hw, z1], [x1 + hw, z1], [x2 + hw, z2], [x2 - hw, z2]], '#f4f7f2');
  else ground([[x1, z1 - hw], [x2, z2 - hw], [x2, z2 + hw], [x1, z1 + hw]], '#f4f7f2');
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  const sc = Math.min(1, 1920 / W); W = Math.round(W * sc); H = Math.round(H * sc);
  CV.width = W; CV.height = H;
  buildAssets();
}
/** Pubblico (motivo ripetuto) e alone dei riflettori, preparati una volta. */
function buildAssets() {
  const c = document.createElement('canvas'); c.width = 240; c.height = 120;
  const g = c.getContext('2d');
  g.fillStyle = '#141a2c'; g.fillRect(0, 0, 240, 120);
  const shirts = ['#e53935', '#ffd600', '#f5f5f5', '#42a5f5', '#66bb6a', '#ab47bc', '#ff8a65', '#26c6da', '#37474f', '#5c6bc0'];
  const skins = ['#f1c7a5', '#d9a07a', '#a86f4c', '#6d4530', '#f5d3b8'];
  for (let row = 0; row < 6; row++) {
    for (let k = 0; k < 12; k++) {
      const x = k * 20 + (row % 2) * 10 + Math.random() * 3, y = row * 20 + 6;
      g.fillStyle = shirts[(Math.random() * shirts.length) | 0];
      g.beginPath(); g.ellipse(x + 6, y + 12, 7, 6, 0, 0, 7); g.fill();
      g.fillStyle = skins[(Math.random() * skins.length) | 0];
      g.beginPath(); g.arc(x + 6, y + 3, 4, 0, 7); g.fill();
    }
  }
  FX.crowd = CTX.createPattern(c, 'repeat');
  const l = document.createElement('canvas'); l.width = l.height = 128;
  const lg = l.getContext('2d'), rg = lg.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, 'rgba(255,255,240,1)'); rg.addColorStop(0.15, 'rgba(255,250,220,.55)'); rg.addColorStop(1, 'rgba(255,240,200,0)');
  lg.fillStyle = rg; lg.fillRect(0, 0, 128, 128);
  FX.glow = l;
}

function updateCamera(dt) {
  autoView();
  const k = 1 - Math.exp(-dt * 7);
  let tx, ty, tz, tp;
  if (fp()) {
    const p = P[0];
    tx = p.x; ty = 1.75; tz = p.z - 1.25; tp = 0.06;
    // Al servizio si alza lo sguardo verso il lancio di palla.
    if (S.phase === 'toss' && S.tossBy === 0) tp = -0.38;
    else if (S.phase === 'serve' && S.server === 0) tp = 0.0;
    const moving = Math.hypot(p.tx - p.x, p.tz - p.z) > 0.15;
    if (moving && !S.paused) ty += Math.sin(FX.t * 13) * 0.025;
    FOC = H * 0.92;
  } else {
    tx = P[0].x * 0.3; ty = 8.5; tz = -25; tp = 0.36;
    FOC = Math.min(H * 1.3, W * 0.98);
  }
  CAM.x += (tx - CAM.x) * k; CAM.y += (ty - CAM.y) * k; CAM.z += (tz - CAM.z) * k; CAM.pitch += (tp - CAM.pitch) * k * 0.8;
  if (Math.abs(CAM.z - tz) > 6) { CAM.x = tx; CAM.y = ty; CAM.z = tz; CAM.pitch = tp; }  // cambio di visuale: salto
}

function drawSky() {
  const g = CTX.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02040b'); g.addColorStop(0.45, '#0b1430'); g.addColorStop(1, '#16244a');
  CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
}
function drawStadium() {
  // terreno attorno, muri e tribune
  ground([[-40, -45], [40, -45], [40, 45], [-40, 45]], '#123d2a');
  const zb = HL + 7.5, xs = DW + 8;
  polyW([[-40, 0, zb], [40, 0, zb], [40, 1.3, zb], [-40, 1.3, zb]], '#0d5c38');                      // muro di fondo
  polyW([[-40, 1.3, zb], [40, 1.3, zb], [40, 15, zb + 16], [-40, 15, zb + 16]], FX.crowd);          // tribuna di fondo
  polyW([[-40, 1.3, zb], [40, 1.3, zb], [40, 15, zb + 16], [-40, 15, zb + 16]], 'rgba(5,10,25,.35)');
  for (const sg of [-1, 1]) {
    polyW([[sg * xs, 0, -HL - 12], [sg * xs, 0, zb], [sg * xs, 1.3, zb], [sg * xs, 1.3, -HL - 12]], '#0b5233');
    polyW([[sg * xs, 1.3, -HL - 12], [sg * xs, 1.3, zb], [sg * (xs + 14), 13, zb], [sg * (xs + 14), 13, -HL - 12]], FX.crowd);
    polyW([[sg * xs, 1.3, -HL - 12], [sg * xs, 1.3, zb], [sg * (xs + 14), 13, zb], [sg * (xs + 14), 13, -HL - 12]], 'rgba(5,10,25,.45)');
  }
  // scritte sul muro di fondo
  const q = proj(0, 0.65, zb - 0.02);
  if (q) {
    CTX.fillStyle = 'rgba(255,255,255,.88)'; CTX.font = `800 ${Math.max(8, 0.75 * q.s)}px system-ui`; CTX.textAlign = 'center'; CTX.textBaseline = 'middle';
    for (const [x, t] of [[-9, 'TENNIS SCORE MANAGER'], [0, 'TSM ARENA'], [9, 'TENNIS SCORE MANAGER']]) { const p = proj(x, 0.65, zb - 0.02); if (p) CTX.fillText(t, p.x, p.y); }
  }
  // torri dei riflettori
  for (const [x, z] of [[-(DW + 13), HL + 11], [DW + 13, HL + 11], [-(DW + 13), -HL - 6], [DW + 13, -HL - 6]]) {
    const b = proj(x, 0, z), t = proj(x, 24, z);
    if (!b || !t) continue;
    CTX.strokeStyle = '#2a3550'; CTX.lineWidth = Math.max(1.5, 0.4 * t.s); CTX.beginPath(); CTX.moveTo(b.x, b.y); CTX.lineTo(t.x, t.y); CTX.stroke();
    CTX.fillStyle = '#e8ecf5'; const w = 3 * t.s, h = 1.4 * t.s; CTX.fillRect(t.x - w / 2, t.y - h, w, h);
    CTX.globalCompositeOperation = 'lighter';
    const r = Math.max(30, 18 * t.s); CTX.drawImage(FX.glow, t.x - r, t.y - h / 2 - r, r * 2, r * 2);
    CTX.globalCompositeOperation = 'source-over';
  }
}
function drawCourt() {
  ground([[-DW - 3.6, -HL - 6.4], [DW + 3.6, -HL - 6.4], [DW + 3.6, HL + 6.4], [-DW - 3.6, HL + 6.4]], '#2c6e9e');
  const far = proj(0, 0, HL), near = proj(0, 0, Math.max(-HL, CAM.z + 2));
  let fill = '#25589a';
  if (far && near) { const g = CTX.createLinearGradient(0, far.y, 0, near.y); g.addColorStop(0, '#2d66ad'); g.addColorStop(1, '#1f4f8f'); fill = g; }
  ground([[-DW, -HL], [DW, -HL], [DW, HL], [-DW, HL]], fill);

      g.lineWidth = 0.8 * u; g.strokeStyle = 'rgba(0,0,0,.5)';
      g.strokeText(S.fb, q.x, q.y - (1.1 - S.fbT) * 6 * u); g.fillText(S.fb, q.x, q.y - (1.1 - S.fbT) * 6 * u); g.globalAlpha = 1;
    }
  }
}
function drawVignette() {
  const g = CTX.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  CTX.fillStyle = g; CTX.fillRect(0, 0, W, H);
  if (FX.flash > 0) { CTX.fillStyle = `rgba(255,255,240,${FX.flash * 0.6})`; CTX.fillRect(0, 0, W, H); }
}
let lastFrame = 0;
function render() {
  const now = performance.now(), dt = Math.min(0.05, (now - (lastFrame || now)) / 1000); lastFrame = now;
  if (!S.paused) updateFx(dt);
  updateCamera(dt);
  if (gfxMode !== '2d' && window.Arena3D) {
    // 3D: la scena la disegna three.js sotto; qui sopra solo tabellone, scritte e vignettatura.
    let ok = true;
    try { ok = Arena3D.render(FX.t); } catch (e) { ok = false; }
    CTX.clearRect(0, 0, W, H);
    drawVignette();
    drawHUD();
    if (!ok && !/[?&]keep3d=1/.test(location.search)) { gfxFailed[gfxMode] = true; applyGfx(); }
    return;
  }
  CTX.save();
  if (FX.shake > 0) CTX.translate(gauss() * FX.shake * H * 0.03, gauss() * FX.shake * H * 0.03);
  drawSky();
  drawStadium();
  drawCourt();
  const b = S.ball, items = [{ z: 0, f: drawNet }, { z: P[1].z, f: () => drawPlayer(P[1], 1) }];
  if (!fp()) items.push({ z: P[0].z, f: () => drawPlayer(P[0], 0) });
  if (b.show && b.y > -0.5) { items.push({ z: b.z + 0.02, f: drawShadow }); items.push({ z: b.z - 0.01, f: drawBall }); }
  items.sort((a, c) => c.z - a.z).forEach(it => it.f());
  drawTarget();
  drawFx();
  if (fp()) drawFirstPerson();
  CTX.restore();
  drawVignette();
  drawHUD();
}

/* ----------------------------- Grafica 3D (three.js, assets/arena/arena3d.js) -------------------------------- */
// CFG.gfx: 0 = 2D (questa pagina), 1 = 3D semplice (low-poly), 2 = 3D realistica. Se la TV non ha WebGL o va a
// scatti si scende da sola: realistica → semplice → 2D.
let gfxMode = '2d', gfxLoading = false;
const gfxFailed = { real: false, low: false };
const ASSET = n => (location.protocol === 'file:' ? 'arena/' : '/arena/') + n;
function hasWebGL() { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; } }
function loadScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
function wantGfx() { return CFG.gfx === 2 && !gfxFailed.real ? 'real' : (CFG.gfx >= 1 && !gfxFailed.low ? 'low' : '2d'); }
const api3d = {
  S, P, CFG, FX, CAM, human, idealTc, netH, WIN_BEFORE, consts: { HL, HW, DW, SVC },
  view: () => VIEW, H: () => H, FOC: () => FOC, asset: ASSET,
};
async function applyGfx() {
  const want = wantGfx();
  if (gfxLoading || want === gfxMode) return;
  if (gfxMode !== '2d' && window.Arena3D) Arena3D.dispose();
  gfxMode = '2d'; $('#gl').style.display = 'none';
  if (want === '2d') return;
  if (!hasWebGL()) { gfxFailed.real = gfxFailed.low = true; return; }
  gfxLoading = true;
  try {
    if (!window.Arena3D) await loadScript(ASSET('arena3d.js'));
    await Arena3D.init($('#gl'), api3d, want);
    gfxMode = want; $('#gl').style.display = 'block';
  } catch (e) { gfxFailed[want] = true; }
  gfxLoading = false;
  if (wantGfx() !== gfxMode) applyGfx();
}

/* ----------------------------- Schermate sopra il campo -------------------------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function playersHtml() {
  const row = i => {
    const band = i === 0 ? CFG.p1.band : CFG.p2.band;
    const st = human(i) ? `<div class="small ${band ? 'ok' : 'warn'}">${band ? '● ' + T.bandOn : '○ ' + T.bandOff}</div>` : `<div class="small">${T.levels[CFG.level - 1]}</div>`;
    return `<div><div class="pl"><i style="background:${P[i].shirt}"></i>${esc(nameOf(i))}</div>${st}</div>`;
  };
  return `<div class="players">${row(0)}<div class="pl">–</div>${row(1)}</div>`;
}
function statsHtml() {
  const cols = [0, 1].filter(human);
  const v = [s => s.hits, s => s.perfect, s => s.early, s => s.late, s => s.wrong, s => Math.round(s.maxGyro)];
  let h = `<table><tr><th></th>${cols.map(i => `<th>${esc(nameOf(i))}</th>`).join('')}</tr>`;
  T.stats.forEach((label, k) => { h += `<tr><td>${label}</td>${cols.map(i => `<td class="n">${v[k](S.st[i])}</td>`).join('')}</tr>`; });
  h += `<tr><td>${T.rally}</td><td class="n" colspan="${cols.length}">${S.longest || 0}</td></tr></table>`;
  return h;
}
function ovRender() {
  const ov = $('#ov'), card = $('#card');
  let html = '<h1>TSM <span>Arena</span></h1>';
  if (link === 'closed') {
    html += `<div class="big">${T.closed}</div>`;
  } else if (!gotCfg) {
    html += `<div class="big">${T.wait}</div><div class="mid ball">${T.waitSub}</div><div class="small">${link === 'lost' ? T.lost : T.link}</div>`;
  } else if (S.paused) {
    html += `<div class="big">${T.paused}</div>${playersHtml()}<div class="mid">${T.pauseHint}</div>`;
  } else if (S.phase === 'over') {
    html += `<div class="big ball">${esc(nameOf(S.winner))} ${T.wins} ${S.games[0]}–${S.games[1]}</div>${statsHtml()}<div class="mid">${T.rematch}</div>`;
  } else if (S.phase === 'title') {
    html += `${playersHtml()}<div class="big">${T.start}</div><div class="mid">${(CFG.two ? '' : T.levels[CFG.level - 1] + ' · ') + T.firstTo(CFG.games)}</div>
      <div class="small">${AC && AC.state === 'running' ? '' : '🔈 ' + T.audio}${DEMO ? '<br>' + T.keys : ''}</div>`;
  } else { ov.classList.add('hide'); return; }
  ov.classList.remove('hide');
  card.innerHTML = html;
}

/* ----------------------------- Collegamento al telefono -------------------------------- */
function onMessage(d) {
  if (!d || !d.t) return;
  if (d.t === 'cfg') {
    const lang = TX[d.lang] ? d.lang : 'en';
    T = TX[lang]; document.documentElement.lang = lang;
    const wasTwo = CFG.two;
    Object.assign(CFG, {
      level: clamp(+d.level || 2, 1, 3), games: clamp(+d.games || 3, 1, 9), strict: d.strict !== false, voice: d.voice !== false,
      lagMs: clamp(+d.lagMs || 0, 0, 400), two: !!d.two, p1: d.p1 || CFG.p1, p2: d.p2 || CFG.p2,
      gfx: d.gfx === undefined ? CFG.gfx : clamp(+d.gfx || 0, 0, 2),
    });
    applyGfx();
    gotCfg = true;
    if (link === 'closed') link = 'ok';
    // Cambiano i giocatori a partita in corso: si ricomincia dalla schermata iniziale.
    if (wasTwo !== CFG.two && S.phase !== 'title') { S.phase = 'title'; S.paused = false; }
    ovRender();
  } else if (d.t === 'swing') onSwing((+d.side || 1) - 1, clamp(+d.s || 0.5, 0.1, 1), +d.gyro || 0);
  else if (d.t === 'stroke') onStroke((+d.side || 1) - 1, +d.k);
  else if (d.t === 'key') onKey((+d.side || 1) - 1, +d.k);
  else if (d.t === 'closed') { link = 'closed'; S.phase = 'title'; S.paused = false; ovRender(); }
}
function connect() {
  if (DEMO || !window.EventSource) return;
  const es = new EventSource('/arena/events');
  es.onopen = () => { if (link !== 'closed') link = 'ok'; ovRender(); };
  es.onmessage = e => { try { onMessage(JSON.parse(e.data)); } catch (x) {} };
  es.onerror = () => {
    if (link !== 'closed') link = 'lost';
    ovRender();
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
  };
}

/* ----------------------------- Avvio -------------------------------- */
function toggleFS() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} }
function init() {
  CV = $('#cv'); CTX = CV.getContext('2d');
  resize(); addEventListener('resize', () => { resize(); if (gfxMode !== '2d' && window.Arena3D) Arena3D.resize(); });
  if (DEMO) { const q = new URLSearchParams(location.search), l = q.get('lang'); onMessage({ t: 'cfg', lang: TX[l] ? l : 'it', level: 2, games: 3, strict: true, voice: true, lagMs: 70, two: q.get('two') === '1', gfx: q.has('gfx') ? +q.get('gfx') : 2, p1: { name: 'Rossi', band: true }, p2: { name: 'Bianchi', band: true } }); }
  connect();
  ovRender();
  // Telecomando della TV o tastiera: OK/Invio sblocca l'audio; SPAZIO fa da swing (prove senza braccialetto).
  addEventListener('keydown', e => {
    const wasLocked = !AC || AC.state !== 'running';
    unlockAudio();
    if (e.code === 'Space') { e.preventDefault(); onSwing(0, 0.7, 0); }
    else if (e.key === 'Enter' && !wasLocked) onKey(0, 1);
    else if (e.key === 'p' || e.key === 'P') onKey(0, 2);
    else if (e.key === 'f' || e.key === 'F') toggleFS();
    else if (e.key === 'v' || e.key === 'V') { viewForced = true; VIEW = fp() ? 'tv' : 'fp'; }
    if (wasLocked) setTimeout(ovRender, 200);
  });
  addEventListener('pointerdown', () => { unlockAudio(); setTimeout(ovRender, 200); });
  $('#fsBtn').onclick = toggleFS;
  if (window.speechSynthesis) speechSynthesis.getVoices();
  // Prove automatiche dell'anteprima: avanza il gioco di n passi e disegna, senza il tempo reale.
  if (DEMO) window.__step = n => { for (let k = 0; k < n; k++) update(DT); lastFrame = performance.now() - n * DT * 1000; render(); };
  let last = performance.now(), acc = 0;
  if (/[?&]manual=1/.test(location.search)) return;
  (function frame(now) {
    acc += Math.min(0.05, (now - last) / 1000); last = now;
    while (acc >= DT) { update(DT); acc -= DT; }
    render();
    requestAnimationFrame(frame);
  })(last);
}
init();
</script>
