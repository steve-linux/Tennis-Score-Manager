#
# Sito tennis-score-manager.netlify.app: pagine statiche in website/, senza build.
# Il sito si pubblica SOLO quando lo si chiede, così i deploy (e i crediti di Netlify) sono pochi:
#   - un commit su main con [sito] nel messaggio (deliver/pubblica_sito.sh lo fa da solo), oppure
#   - un build hook di Netlify chiamato apposta (Configurazione del progetto > Build hooks).
# Tutto il resto si salta: i commit normali, le anteprime dei rami e delle pull request.
[build]
  publish = "website"
  # Uscita 1 = pubblica, 0 = salta (un deploy saltato non pubblica niente).
  ignore = "if [ -n \"$INCOMING_HOOK_URL\" ]; then exit 1; fi; if [ \"$CONTEXT\" = production ] && git log -1 --format=%B \"$COMMIT_REF\" | grep -qiF '[sito]'; then exit 1; fi; exit 0"
